# ESA Summer Online 2020 — issue #53. Consumed by Build/release-event.sh.
#
# One entry per horaro schedule, because the app models each stream as its own
# event. The name on the right must match a row already in the events table, or
# something close enough to it that nobody notices the difference — a new
# spelling does not fail, it silently creates a second event beside the one
# people expect. Check before adding an event that is not here yet:
#
#   docker compose exec -T db psql -U "$DB_USER" -d "$DB_NAME" -c 'select name from events order by id;'

EVENT="ESA Summer Online 2020"
ISSUE=53

# A single schedule of 172 rows — the largest of the twelve. ESA ran one stream
# through the 2020 lockdown summer, so this is one event and one CSV, following
# #50 and #51 rather than the (One)/(Two) pairs of #43–#49.
#
# The name is new: the restored production database holds `ESA 2020 Winter
# (One)`/`(Two)` but nothing for the summer, and this is a different event from
# either. `ESA 2020 Summer Online` keeps the site's `ESA <year> <season>` form
# and carries the "Online" that the schedule itself uses — ESA held no in-person
# summer marathon in 2020.
#
# The schedule's Game cells link Twitch VODs, which ESA deleted years ago, so
# there is no `horaro-link` answer here at all: every row is resolved by title
# search on `#ESASummerOnline`.
SCHEDULES="
esa-summer-online-2020 | ESA 2020 Summer Online
"

# Human answers to the review list, and the index that numbers them. Both are
# optional: without them the release ships the OCR's own reading of every run.
ANSWERS="answers.txt"
INDEX="review-index.csv"
