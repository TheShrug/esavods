; Overrides the image's default www.conf. See the PR body for the RSS
; measurement pm.max_children is derived from — this file is not a guess.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Route worker stdout/stderr through fpm's error log, so a PHP fatal that
; bypasses Laravel is still in `docker logs` when a Coolify deploy comes up
; broken.
;
; Both are already set by the image's own php-fpm.d/docker.conf, which loads
; before this file - so this is a restatement, not a change, and #21 was wrong
; that the output is lost today. Kept because it makes the pool's logging
; explicit instead of inherited, and matches speedrunwr. Measured rather than
; assumed: flipping catch_workers_output to `no` loses a worker's raw stderr
; entirely, so the setting is load-bearing - it just is not this file currently
; supplying it. decorate off because the "child N said into stdout:" prefix
; wraps each line and breaks multi-line stack traces.
catch_workers_output = yes
decorate_workers_output = no
