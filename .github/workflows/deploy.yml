# Production deploy. Pushing to master IS the release.
#
# Coolify builds the image from this repo, so this workflow ships no artefact - it runs the gate,
# then tells Coolify to pull and rebuild, then proves the result is actually serving. All the
# deploy logic that could live on the host does live on the host: see the note on the SSH key.
#
# What stands between a merge and production is the `test` and `build` jobs below, both of which
# `deploy` needs. A red suite never reaches the host, and neither does a front-end bundle that
# does not match the sources it was built from.
#
# Secrets this needs (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY     private half of a DEDICATED deploy key, not a personal one.
#   DEPLOY_KNOWN_HOSTS the host's public key line, so the runner is not trusting on first use.
#                      ssh-keyscan -t ed25519 <host-ip>. In a secret rather than this file because
#                      rebuilding the host changes it, and that should not need a commit.
#
# Note what is NOT here: no Coolify API token and no application config. The key is restricted on
# the host to a forced command that accepts only `deploy` or `status`, against ONE hard-coded
# application uuid. It cannot open a shell, read the API token, or touch another app - so the
# blast radius of this secret leaking is "someone can redeploy esavods". SSH is the single
# credential GitHub holds.
name: Deploy

on:
  push:
    branches: [master]
    # A commit that cannot change what production serves does not need a cold image rebuild.
    # Use the manual dispatch if one somehow does.
    #
    # `tools/**` is here because tools/vod-timer is a local OCR pipeline, run by hand out of its
    # own image against a bind-mounted checkout. Nothing the app serves references it - only
    # Build/release-event.sh and the Makefile, both developer-side. It is also .dockerignore'd,
    # which is what makes this entry honest: a path ignored here but still copied into the image
    # would leave production carrying bytes from a commit it was never rebuilt for.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tools/**'
  workflow_dispatch:

# Deploys queue rather than cancel. cancel-in-progress would be actively harmful: killing this
# mid-flight leaves Coolify part-way through a rebuild.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 104.168.22.102

jobs:
  # Deliberately duplicated from ci.yml rather than shared. ci.yml covers branches and PRs; this
  # copy is the one that can stop a release, and a release gate should not depend on another
  # workflow file staying correct.
  test:
    name: artisan test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql
          coverage: none
      - name: Generate a throwaway APP_KEY
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Create an empty .env so the framework stops warning
        run: touch .env
      - run: php artisan migrate --force
      - run: php artisan test --fail-on-warning

  # Also deliberately duplicated from ci.yml, for the same reason as `test` above: this copy
  # is the one that can stop a release.
  #
  # public/js/app.js and public/css/app.css are tracked files and the app Dockerfile has no
  # Node stage, so the image Coolify is about to build ships exactly the bytes in this
  # commit. If they are stale, everything below this job still succeeds - the deploy runs,
  # "Assert production is on this commit" passes because production really IS on this commit,
  # and the site serves the old bundle with a green tick over it. That is the same shape as
  # the 2026-08-23 false-green, one layer further in: the right commit carrying a stale
  # artefact. See ci.yml for the full note and for what to do if the build stops being
  # byte-reproducible.
  build:
    name: npm run build parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assert the committed bundle matches the sources
        run: |
          if ! git diff --exit-code -- public/js/app.js public/css/app.css; then
            echo "::error::public/js/app.js or public/css/app.css is stale - the diff above is what production would be missing. Run 'npm run build' and commit the result; the Dockerfile has no Node stage, so these files are served verbatim."
            exit 1
          fi

  deploy:
    name: Redeploy and verify
    # Both gates, not just the suite: a stale bundle deploys perfectly and serves the wrong
    # site.
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://esavods.com
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/deploy_key <<< "$DEPLOY_SSH_KEY"
          install -m 644 /dev/stdin ~/.ssh/known_hosts <<< "$DEPLOY_KNOWN_HOSTS"

      # SSH_KEY is set in `run:`, not `env:`, and that is not a style choice. A workflow `env:`
      # block is literal - no shell expansion - so `SSH_KEY: ~/.ssh/deploy_key` arrives as the
      # characters `~/.ssh/...` and every file test fails on a path that does not exist. That
      # cost one failed production deploy on the sibling repo, 2026-08-09.
      # `deploy` is SYNCHRONOUS on the host as of homelab#34. It triggers the deployment,
      # then follows Coolify's own deployment record to a terminal state, and exits non-zero
      # on `failed` or on a timeout. So a failure here means the DEPLOYMENT failed - not that
      # a poll gave up.
      #
      # What this replaces, and why: the previous check polled for `running:healthy` AND for
      # `last_online_at` to move. Both passed against the OLD container on 2026-08-23, because
      # Coolify sets `last_online_at` from its own health observations rather than from
      # container creation. A build that died on a transient GitHub 504 was reported as a
      # successful deploy, and this repo's master sat outside production with a green tick
      # over it. The second condition had been added specifically to catch that, and did not.
      - name: Deploy, and wait for Coolify's own verdict
        run: |
          SSH_KEY="$HOME/.ssh/deploy_key"
          set -o pipefail
          ssh -i "$SSH_KEY" -o IdentitiesOnly=yes -o BatchMode=yes             "root@$DEPLOY_HOST" deploy | tee deploy.log

      # The ONLY condition that means "production is on this commit". Coolify reports the
      # commit it actually built. Everything else the old check looked at - healthy,
      # last_online_at, a 200 from the edge - is equally true of an old container that never
      # stopped serving.
      - name: Assert production is on this commit
        run: |
          BUILT=$(sed -n 's/^coolify-ci: deployment finished, commit=//p' deploy.log | tail -1)
          echo "built=$BUILT"
          echo "expected=$GITHUB_SHA"
          if [ -z "$BUILT" ]; then
            echo "::error::the deploy reported no commit. The host's /usr/local/bin/coolify-ci is out of date - install scripts/host/coolify-ci from the homelab repo (homelab#34)."
            exit 1
          fi
          if [ "$BUILT" != "$GITHUB_SHA" ]; then
            echo "::error::Coolify built $BUILT but this run is $GITHUB_SHA. Production is NOT on this commit - most likely another push landed mid-deploy."
            exit 1
          fi
          echo "production is on $GITHUB_SHA"

      # Confirms from outside the box, which is the only vantage that proves the edge and the
      # tunnel agree with the container. Being up locally proves nothing.
      - name: Verify from the public internet
        run: |
          for path in /up /; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "https://esavods.com$path")
            echo "https://esavods.com$path -> $CODE"
            [ "$CODE" = "200" ] || { echo "::error::expected 200 from $path, got $CODE"; exit 1; }
          done

      # Last step, and non-fatal ONLY for transient failures. By now the release is live and
      # verified; a stale edge is a smaller problem than a red deploy that teaches people to
      # ignore the pipeline.
      #
      # But a refusal is not transient. Exit 64 from the host means misconfiguration - an
      # unknown verb, or no zone id in authorized_keys - and it will never fix itself. Every
      # purge from every repo was refused from the day this step was written until homelab#35
      # found it, and it stayed invisible for exactly one reason: the step turned a permanent
      # failure into the same warning a transient one produces. So 64 is now fatal.
      #
      # Cloudflare answers HTTP 200 with {"success":false}, so the host tests the response
      # BODY. Exit status alone would pass on a refusal - the same false-green shape as
      # pg_restore exiting 0 on an empty restore.
      #
      # The zone id is baked into authorized_keys on the host, not passed from here: this key
      # can purge exactly one zone and no other.
      - name: Purge the Cloudflare cache
        run: |
          SSH_KEY="$HOME/.ssh/deploy_key"
          set +e
          OUT=$(ssh -i "$SSH_KEY" -o IdentitiesOnly=yes -o BatchMode=yes "root@$DEPLOY_HOST" purge 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" = "0" ]; then
            echo "cache purged"
            exit 0
          fi
          if [ "$RC" = "64" ]; then
            echo "::error::purge refused by the host (exit 64): the verb or the zone id is missing from authorized_keys. See homelab#35."
            exit 1
          fi
          echo "::warning::purge failed (exit $RC), the edge may be stale. Transient - read the body above."
