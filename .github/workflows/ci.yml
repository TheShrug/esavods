# Run the test suite, and the front-end build parity check, on every branch except master and
# on every pull request.
#
# master is deliberately absent: deploy.yml will own it and run this same suite as the gate in
# front of the deploy. Two workflows triggering on master would run the suite twice and tell you
# the same thing - and the copy that matters is the one that can stop a release.
#
# Trunk-based development removed the staging beat (Conventions/Branching.md in the homelab
# vault): merging to master IS the release, so this job is the only thing between a merged PR and
# the live site.
name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: artisan test
    runs-on: ubuntu-latest

    # A throwaway Postgres, NOT the repo's docker-compose.yml. See the env: block below for why
    # that distinction is load-bearing rather than stylistic.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Configuration comes from here and nowhere else. No .env is written.
    #
    # This is deliberate and it is the whole point of the job's shape. compose passes
    # `env_file: .env` to the app service, which puts DB_* into the container's real OS
    # environment; Laravel's env() reads $_SERVER while PHPUnit's <env> only sets $_ENV, so
    # phpunit.xml's sqlite config never wins and RefreshDatabase truncates whatever the container
    # points at. That is esavods#22. Running the suite through compose here would inherit the
    # same footgun - harmless against a throwaway service container, which is exactly how the
    # pattern gets copied back to a laptop pointing at a real database.
    #
    # Real environment variables beat phpunit.xml's <env> for the same $_SERVER reason, so these
    # win and the suite genuinely runs against Postgres - the engine production uses.
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql
          coverage: none

      # Generated per run rather than committed. A literal key here would read as a leaked secret
      # to anyone skimming the file, and there is no reason for CI to reuse one.
      - name: Generate a throwaway APP_KEY
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: composer install --no-interaction --prefer-dist --no-progress

      # Nothing reads it - every setting above comes from env: - but the framework warns on a
      # missing one, and --fail-on-warning below turns that warning into a red branch.
      # deploy.yml has carried this step since it was written; this file never had it. #79
      # closed the gap.
      - name: Create an empty .env so the framework stops warning
        run: touch .env

      - run: php artisan migrate --force

      # --fail-on-warning is not optional: CI's first green run reported success with five
      # Feature tests that never executed, which is why the Makefile's `test` target carries
      # the flag too.
      #
      # deploy.yml has had it since it was written and this file has not, so until #79 the
      # RELEASE gate was stricter than the branch gate - a warning would first surface at the
      # moment it could block a deploy, which is the worst moment to meet one. The
      # duplication between the two files is deliberate; this divergence was not.
      - run: php artisan test --fail-on-warning

  # The front end is built HERE and nowhere else in the pipeline, and that is the whole
  # reason this job exists. public/js/app.js and public/css/app.css are TRACKED files: the
  # app Dockerfile has no Node stage at all, so Coolify ships whatever is committed,
  # verbatim.
  #
  # Without this job the following sequence passes every check we have: edit
  # resources/js/app.js or resources/sass/app.scss, forget `npm run build`, merge. deploy.yml
  # goes green INCLUDING its "Assert production is on this commit" step - production really
  # is on that commit - and the site serves the old bundle. The source change is live in the
  # repo and absent from the site, and nothing anywhere reports it.
  #
  # A hand-check cannot catch this, which is the asymmetry that makes it worth automating
  # even though browser tests are deliberately out of scope. Rebuild locally, verify in
  # `make run`, forget to commit the rebuilt public/ file: the browser you just tested in was
  # serving the correct assets while the repo carries the old ones. It looks exactly like
  # success.
  #
  # A `git diff` gate is only safe if the build is byte-reproducible, so that was verified by
  # hand before this was written (#79): two builds from a clean node_modules, on the Node
  # major in .nvmrc, reproduced the committed bytes exactly. If that ever stops holding, the
  # fix is a Node stage in the Dockerfile and untracking public/js and public/css - NOT a
  # fuzzier comparison here. A check that flaps is worse than no check, because it trains
  # people to re-run until green.
  build:
    name: npm run build parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # node-version-file, not a literal version: .nvmrc is what a laptop reads too, so the
      # version that PRODUCES the bundle is the version that checks it. A literal here would
      # drift from .nvmrc silently, and the only symptom would be a diff nobody can reproduce
      # locally.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # --exit-code makes the diff itself the failure, and prints it. `git status
      # --porcelain` would not: it exits 0 whatever it printed, which is the same false-green
      # shape as pg_restore exiting 0 on an empty restore.
      - name: Assert the committed bundle matches the sources
        run: |
          if ! git diff --exit-code -- public/js/app.js public/css/app.css; then
            echo "::error::public/js/app.js or public/css/app.css is stale - the diff above is what production is missing. Run 'npm run build' and commit the result; the Dockerfile has no Node stage, so these files are served verbatim."
            exit 1
          fi
