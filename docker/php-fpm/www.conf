; Overrides the image's default www.conf. See the PR body for the RSS
; measurement pm.max_children is derived from — this file is not a guess.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Route worker stdout/stderr through fpm's error log rather than leaving it on
; whatever fds the worker inherited, so a PHP fatal that bypasses Laravel is
; still in `docker logs` when a Coolify deploy comes up broken.
;
; Measured, because #21 assumed more than this buys: the image's own
; zz-docker.conf sets `daemonize = no`, which overrides the entrypoint's
; `php-fpm -D`, so fpm stays in the foreground and workers already inherit the
; container's stdout today. These lines are what keeps that true if fpm ever
; does daemonize or error_log moves off fd 2 — not the difference between
; having a log and having nothing. decorate off because the "child N said into
; stdout:" prefix wraps each line and breaks multi-line stack traces.
catch_workers_output = yes
decorate_workers_output = no
