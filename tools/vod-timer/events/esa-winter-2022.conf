# ESA Winter 2022 — issue #50. Consumed by Build/release-event.sh.
#
# One entry per horaro schedule, because the app models each stream as its own
# event. The name on the right must match a row already in the events table, or
# something close enough to it that nobody notices the difference — a new
# spelling does not fail, it silently creates a second event beside the one
# people expect. Check before adding an event that is not here yet:
#
#   docker compose exec -T db psql -U "$DB_USER" -d "$DB_NAME" -c 'select name from events order by id;'

EVENT="ESA Winter 2022"
ISSUE=50

# A single schedule. Every backfill from #43 to #49 shipped an (One)/(Two) pair
# because those events ran two streams; ESA ran one in February 2022, so this is
# one event and one CSV. The spelling follows the site's existing single-stream
# form — `ESA 2021 Winter`, `ESA 2018 Winter` — not the two-stream one. No event
# of this name existed before this release.
#
# The schedule's Game cells link Twitch VODs, not YouTube, so there are no
# `horaro-link` answers here: every row is resolved by title search on
# `#ESAWinter22`.
SCHEDULES="
esa-winter-2022 | ESA 2022 Winter
"

# Human answers to the review list, and the index that numbers them. Both are
# optional: without them the release ships the OCR's own reading of every run.
ANSWERS="answers.txt"
INDEX="review-index.csv"
